add_newline = true

format = """
$directory
$git_branch
$character
"""

[directory]
style = "bold white"
format = "╭─ 󰉋 [$path]($style)\n"
truncate_to_repo = false
truncation_length = 6
truncation_symbol = "…/"

[git_branch]
symbol = "󰊢 "
style = "bright-black"
format = "├─ [$symbol$branch]($style)\n"

[character]
success_symbol = "[╰─ ❯](bold green)"
error_symbol = "[╰─ ❯](bold red)"
vimcmd_symbol = "[╰─ ❮](bold yellow)"

